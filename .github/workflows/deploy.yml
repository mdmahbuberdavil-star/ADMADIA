name: Deploy ADMADIA to Firebase

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Hosting (Preview on PR)
        if: github.event_name == 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ADMADIA }}
          projectId: adbluemedia-156b6
          expires: 7d

      - name: Deploy Hosting (Live on main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ADMADIA }}
          projectId: adbluemedia-156b6
          channelId: live

      - name: Deploy Realtime Database Rules
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          firebase deploy --only database \
            --project adbluemedia-156b6 \
            --token "${{ secrets.FIREBASE_TOKEN }}"
